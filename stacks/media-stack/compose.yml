name: media-stack
services:
  gluetun:
    image: qmcgaw/gluetun:latest
    container_name: gluetun
    environment:
      - VPN_SERVICE_PROVIDER=mullvad
      - VPN_TYPE=wireguard
      - WIREGUARD_PRIVATE_KEY=${WIREGUARD_PRIVATE_KEY}
      - WIREGUARD_ADDRESSES=${WIREGUARD_ADDRESSES}
      - SERVER_COUNTRIES=Belgium,Netherlands,Germany
      - TZ=Europe/Brussels
      - HTTP_CONTROL_SERVER_AUTH_DEFAULT_ROLE={"auth":"none"}
    cap_add:
      - NET_ADMIN
    ports:
      - 8080:8080
      - 52222:52222
      - 52222:52222/udp
      - 8000:8000
      - 9191:9191
    restart: unless-stopped
  qbittorrent:
    image: linuxserver/qbittorrent:latest
    container_name: qbittorrent
    network_mode: service:gluetun
    environment:
      - PUID=1000
      - PGID=1000
      - WEBUI_PORT=8080
      - TZ=Europe/Brussels
    volumes:
      - ./qbittorrent/config:/config
      - ./media/downloads:/downloads
      - ./media/nba:/nba
    depends_on:
      - gluetun
    restart: unless-stopped
  dispatcharr:
    image: ghcr.io/dispatcharr/dispatcharr:latest
    container_name: dispatcharr
    network_mode: service:gluetun
    environment:
      - DISPATCHARR_ENV=aio
      - TZ=Europe/Brussels
      - REDIS_HOST=localhost
      - CELERY_BROKER_URL=redis://localhost:6379/0
      - DISPATCHARR_LOG_LEVEL=info
    volumes:
      - ./dispatcharr/data:/data
    depends_on:
      - gluetun
    restart: unless-stopped
  radarr:
    image: linuxserver/radarr:latest
    container_name: radarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Brussels
    volumes:
      - ./radarr/config:/config
      - ./media/downloads:/downloads
      - ./media/movies:/movies
    ports:
      - 7878:7878
    restart: unless-stopped
  sonarr:
    image: linuxserver/sonarr:latest
    container_name: sonarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Brussels
    volumes:
      - ./sonarr/config:/config
      - ./media/downloads:/downloads
      - ./media/tv:/tv
      - ./media/reality-tv:/reality-tv
    ports:
      - 8989:8989
    restart: unless-stopped
  prowlarr:
    image: linuxserver/prowlarr:latest
    container_name: prowlarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Brussels
    volumes:
      - ./prowlarr/config:/config
    ports:
      - 9696:9696
    restart: unless-stopped
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    environment:
      - LOG_LEVEL=info
      - TZ=Europe/Brussels
    ports:
      - 8191:8191
    restart: unless-stopped
  jackett:
    image: linuxserver/jackett:latest
    container_name: jackett
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Brussels
    volumes:
      - ./jackett/config:/config
    ports:
      - 9117:9117
    restart: unless-stopped
  bazarr:
    image: linuxserver/bazarr:latest
    container_name: bazarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Brussels
    volumes:
      - ./bazarr/config:/config
      - ./media/movies:/movies
      - ./media/tv:/tv
    ports:
      - 6767:6767
    restart: unless-stopped
  jellyfin:
    image: linuxserver/jellyfin:latest
    container_name: jellyfin
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Brussels
    volumes:
      - ./jellyfin/config:/config
      - ./media:/media
    devices:
      - /dev/dri:/dev/dri
    ports:
      - 8096:8096
    extra_hosts:
      - host.docker.internal:host-gateway
    restart: unless-stopped
  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TOKEN}
    restart: unless-stopped
    depends_on:
      - jellyfin
  plex:
    image: lscr.io/linuxserver/plex:latest
    container_name: plex
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Brussels
      - PLEX_CLAIM=claim-n2Dpd2wETH7fLL8XvRKF
    volumes:
      - ./plex/config:/config
      - ./media:/media
    ports:
      - 32400:32400
    restart: unless-stopped
  pocket-id:
    image: ghcr.io/pocket-id/pocket-id:v2
    container_name: pocket-id
    restart: unless-stopped
    ports:
      - 1411:1411
    volumes:
      - ./pocketid/data:/app/data
    environment:
      - APP_URL=https://auth.jaanlavaerts.com
      - ENCRYPTION_KEY=${POCKETID_ENCRYPTION_KEY}
      - TRUST_PROXY=true
      - RELYING_PARTY_ID=auth.jaanlavaerts.com
      - RELYING_PARTY_ORIGIN=https://auth.jaanlavaerts.com
  tracearr:
    image: ghcr.io/connorgallopo/tracearr:supervised
    container_name: tracearr
    restart: unless-stopped
    ports:
      - 3000:3000
    environment:
      - TZ=Europe/Brussels
      - NODE_ENV=production
    volumes:
      - ./tracearr/data:/data/tracearr
      - ./tracearr/postgres:/data/postgres
      - ./tracearr/redis:/data/redis
      - ./tracearr/imagecache:/app/data
  pelagica:
    image: kartoffelchipss/pelagica:latest
    container_name: pelagica
    ports:
      - 81:80
    volumes:
      - ./config:/config
    restart: unless-stopped
networks: {}
